<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="今日は無理">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>今日は無理</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app"></main>

  <details id="debug" class="debug">
    <summary>デモ操作 <span id="clock" class="clock"></span></summary>
    <div class="debug-body">
      <button data-debug="reset">初期状態に戻す（10/26 月 19:00）</button>
      <button data-debug="wed18">水曜 18:00 へ進める</button>
      <button data-debug="trigger">問いかけを今すぐ出す</button>
      <button data-debug="remind">冷凍のリマインドを今すぐ出す</button>
      <button data-debug="plus60">60分進める</button>
      <button data-debug="satGood">土曜へ（残りは木・金に使った体で）→ 今週のカード</button>
      <button data-debug="satBad">土曜へ（捨てた週）→ 今週のカード</button>
    </div>
  </details>

  <script src="/app.js"></script>
</body>
</html>
